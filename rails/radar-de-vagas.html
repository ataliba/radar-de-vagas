<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radar de vagas</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap');

:root{
  --bg:#0A0E14;
  --panel:#10161F;
  --panel-2:#141C27;
  --border:#1E2A38;
  --border-soft:#182230;
  --text:#DCE4EC;
  --muted:#6B7A8C;
  --muted-2:#8C99A8;
  --accent:#34D3FF;
  --accent-dim:#123645;
  --ok:#2EE6A6;
  --ok-dim:#0F3B30;
  --warn:#F5A623;
  --warn-dim:#3D2C0C;
  --danger:#FF5470;
  --danger-dim:#3D131D;
  --mono:'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --sans:'Inter', system-ui, -apple-system, sans-serif;
  --radius:8px;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);}
.app{max-width:1240px;margin:0 auto;padding:28px 24px 64px;}

/* header */
.topline{display:flex;align-items:center;gap:10px;color:var(--muted);font-family:var(--mono);font-size:12px;margin-bottom:18px;letter-spacing:.02em;}
.topline span:not(:last-child)::after{content:'·';margin-left:10px;color:var(--border);}

.header{display:flex;align-items:center;justify-content:space-between;gap:24px;margin-bottom:22px;flex-wrap:wrap;}
.brand{display:flex;align-items:center;gap:14px;}
.radar-scope{width:42px;height:42px;border-radius:50%;border:1px solid var(--border);position:relative;overflow:hidden;background:radial-gradient(circle at center, var(--panel-2) 0%, var(--bg) 100%);flex-shrink:0;}
.radar-scope::before{content:'';position:absolute;inset:0;background:conic-gradient(from 0deg, rgba(52,211,255,.55), rgba(52,211,255,0) 32%);animation:sweep 3.2s linear infinite;}
.radar-scope::after{content:'';position:absolute;top:50%;left:50%;width:4px;height:4px;margin:-2px;border-radius:50%;background:var(--accent);box-shadow:0 0 6px var(--accent);}
@keyframes sweep{to{transform:rotate(360deg);}}
.brand h1{font-family:var(--mono);font-size:18px;font-weight:700;margin:0;letter-spacing:.02em;}
.brand p{margin:2px 0 0;font-size:12.5px;color:var(--muted);}

.stats{display:flex;gap:10px;flex-wrap:wrap;}
.stat{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:8px 14px;min-width:88px;}
.stat b{display:block;font-family:var(--mono);font-size:18px;font-weight:700;}
.stat span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;}

/* cv banner */
.banner{display:flex;align-items:center;justify-content:space-between;gap:16px;background:var(--warn-dim);border:1px solid #5A4014;border-radius:var(--radius);padding:12px 16px;margin-bottom:20px;flex-wrap:wrap;}
.banner p{margin:0;font-size:13.5px;}
.banner strong{color:var(--warn);}
.banner button{background:transparent;border:1px solid var(--warn);color:var(--warn);font-family:var(--sans);font-weight:600;font-size:12.5px;padding:7px 14px;border-radius:var(--radius);cursor:pointer;}
.banner button:hover{background:var(--warn);color:#241a05;}

/* tabs */
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--border);margin-bottom:18px;}
.tab{font-family:var(--mono);font-size:13px;color:var(--muted);background:none;border:none;padding:10px 4px;margin-right:18px;cursor:pointer;border-bottom:2px solid transparent;}
.tab.active{color:var(--text);border-bottom-color:var(--accent);}
.tab:hover:not(.active){color:var(--muted-2);}

/* controls */
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:20px;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:12px;}
.controls input[type=text]{flex:1;min-width:180px;}
.controls input[type=text],.controls select{background:var(--panel-2);border:1px solid var(--border);color:var(--text);font-family:var(--sans);font-size:13px;padding:8px 10px;border-radius:6px;}
.controls input[type=text]::placeholder{color:var(--muted);}
.controls select{cursor:pointer;}
.chk{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted-2);white-space:nowrap;}
.chk input{accent-color:var(--accent);}
.clear-btn{background:none;border:1px solid var(--border);color:var(--muted-2);font-size:12.5px;padding:8px 12px;border-radius:6px;cursor:pointer;white-space:nowrap;}
.clear-btn:hover{border-color:var(--muted-2);color:var(--text);}

/* table */
.table-wrap{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);overflow-x:auto;}
table{width:100%;border-collapse:collapse;min-width:920px;}
th{text-align:left;font-family:var(--mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:12px 14px;border-bottom:1px solid var(--border);white-space:nowrap;cursor:pointer;user-select:none;}
th:hover{color:var(--muted-2);}
th.sorted{color:var(--accent);}
td{padding:12px 14px;border-bottom:1px solid var(--border-soft);font-size:13.5px;vertical-align:top;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:var(--panel-2);}
.empresa{font-weight:600;}
.vaga{color:var(--text);}
.meta{color:var(--muted);font-size:12px;margin-top:2px;}
.tag{display:inline-block;background:var(--panel-2);border:1px solid var(--border);color:var(--muted-2);font-size:11px;padding:2px 8px;border-radius:20px;white-space:nowrap;}
.badge-cv{font-family:var(--mono);font-size:11px;color:var(--warn);border:1px solid #5A4014;background:var(--warn-dim);padding:3px 8px;border-radius:6px;white-space:nowrap;}
.badge-sim{color:var(--ok);font-size:12.5px;}
.badge-nao{color:var(--muted);font-size:12.5px;}
.mono{font-family:var(--mono);font-size:12px;color:var(--muted-2);}
.add-btn{font-family:var(--mono);font-size:11.5px;background:none;border:1px solid var(--accent);color:var(--accent);padding:5px 10px;border-radius:6px;cursor:pointer;white-space:nowrap;}
.add-btn:hover{background:var(--accent-dim);}
.add-btn:disabled{border-color:var(--border);color:var(--muted);cursor:default;background:none;}
.empty{padding:40px 20px;text-align:center;color:var(--muted);font-size:13.5px;}

/* kanban */
.board{display:flex;gap:14px;overflow-x:auto;padding-bottom:8px;}
.col{flex:0 0 268px;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);display:flex;flex-direction:column;max-height:74vh;}
.col-head{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.col-head-title{font-family:var(--mono);font-size:12.5px;display:flex;align-items:center;gap:6px;}
.col-head-title .prompt{color:var(--accent);}
.col-count{font-family:var(--mono);font-size:11px;color:var(--muted);background:var(--panel-2);border:1px solid var(--border);border-radius:10px;padding:1px 8px;}
.col-body{padding:10px;display:flex;flex-direction:column;gap:8px;overflow-y:auto;flex:1;}
.col-body.dragover{background:var(--accent-dim);}
.card{background:var(--panel-2);border:1px solid var(--border);border-radius:7px;padding:10px 11px;cursor:grab;}
.card:active{cursor:grabbing;}
.card-empresa{font-weight:600;font-size:13.5px;}
.card-vaga{font-size:12.5px;color:var(--muted-2);margin:3px 0 6px;line-height:1.35;}
.card-meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;}
.card-meta .mono{font-size:10.5px;}
.card select{background:var(--panel);border:1px solid var(--border);color:var(--muted-2);font-family:var(--mono);font-size:10.5px;padding:3px 4px;border-radius:5px;max-width:100px;}
.col-empty{padding:24px 10px;text-align:center;color:var(--muted);font-size:12px;font-family:var(--mono);}
</style>
</head>
<body>
<div class="app">

  <div class="topline">
    <span>vagas</span><span>perfil</span><span>presença por empresa</span><span>reimportar dados</span>
  </div>

  <div class="header">
    <div class="brand">
      <div class="radar-scope"></div>
      <div>
        <h1>radar de vagas</h1>
        <p id="subtitle">carregando…</p>
      </div>
    </div>
    <div class="stats" id="stats"></div>
  </div>

  <div class="banner">
    <p>Você ainda não colou seu currículo. <strong>Configure o perfil</strong> para calcular o match de cada vaga.</p>
    <button type="button">Configurar perfil</button>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="radar">$ radar</button>
    <button class="tab" data-tab="pipeline">$ pipeline</button>
  </div>

  <div class="controls">
    <input type="text" id="search" placeholder="Buscar por empresa, vaga ou categoria">
    <select id="f-categoria"><option value="">Todas as categorias</option></select>
    <select id="f-plataforma"><option value="">Todas as plataformas</option></select>
    <select id="f-sort">
      <option value="recente">Mais recentes</option>
      <option value="antigo">Mais antigas</option>
      <option value="empresa">Empresa A-Z</option>
    </select>
    <label class="chk"><input type="checkbox" id="f-alerta"> só com alerta</label>
    <button class="clear-btn" id="clear-filters">Limpar filtros</button>
  </div>

  <div id="view-radar">
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Match</th>
            <th>Empresa</th>
            <th>Vaga</th>
            <th>Plataforma</th>
            <th>Local</th>
            <th>Na lista?</th>
            <th data-sort="detectado">Detectado em</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>
      <div class="empty" id="table-empty" style="display:none;">Nenhuma vaga encontrada com esses filtros.</div>
    </div>
  </div>

  <div id="view-pipeline" style="display:none;">
    <div class="board" id="board"></div>
  </div>

</div>

<script>
const STAGES = [
  {key:'detectado', label:'detectado'},
  {key:'aplicado', label:'aplicado'},
  {key:'triagem', label:'triagem'},
  {key:'entrevista', label:'entrevista'},
  {key:'oferta', label:'oferta'},
  {key:'arquivado', label:'arquivado'},
];

const RAW_JOBS = [
  {id:'ambev-bi-sr', empresa:'Ambev', categoria:'BI / Business Intelligence', vaga:'Business Intelligence Senior', plataforma:'Gupy', local:'Brasil', naLista:true, detectado:'2026-07-15'},
  {id:'cadastra-insights-pl', empresa:'Cadastra', categoria:'Analista de Insights', vaga:'Digital Insights Analyst Pleno | Analista de Dados | 100% Remoto', plataforma:'Gupy', local:'Brasil', naLista:true, detectado:'2026-07-17'},
  {id:'cadastra-insights-sr', empresa:'Cadastra', categoria:'Analista de Insights', vaga:'Digital Insights Analista SR | 100% remoto', plataforma:'Gupy', local:'Brasil', naLista:true, detectado:'2026-07-15'},
  {id:'cadastra-insights-jr', empresa:'Cadastra', categoria:'Analista de Insights', vaga:'Digital Insights Analista JR | 100% remoto', plataforma:'Gupy', local:'Brasil', naLista:true, detectado:'2026-07-15'},
  {id:'conquer-dados-pl', empresa:'Conquer', categoria:'Analista de Dados / Data Analyst', vaga:'Analista de Dados Pleno', plataforma:'Gupy', local:'Brasil', naLista:true, detectado:'2026-07-15'},
  {id:'elife-growth-pl', empresa:'Elife', categoria:'Growth Analyst / Analista de Growth', vaga:'Reserva INK | Analista de Growth Pleno', plataforma:'Gupy', local:'Rio de Janeiro / Brasil', naLista:true, detectado:'2026-07-16'},
  {id:'globalweb-negocios-pl', empresa:'Globalweb', categoria:'Business Analyst / Analista de Negócios', vaga:'Analista de Negócios PL', plataforma:'Gupy', local:'Brasil', naLista:true, detectado:'2026-07-16'},
  {id:'boticario-revenue', empresa:'Grupo Boticário', categoria:'Growth Analyst / Analista de Growth', vaga:'Especialista I Revenue Growth Management (B2B)', plataforma:'Gupy', local:'Brasil', naLista:true, detectado:'2026-07-15'},
  {id:'indra-dados-pl', empresa:'Indra', categoria:'Analista de Dados / Data Analyst', vaga:'Analista de Dados Pleno', plataforma:'Gupy', local:'Brasil', naLista:true, detectado:'2026-07-15'},
];

let jobs = RAW_JOBS.map(j => ({...j, status:'detectado'}));
let activeTab = 'radar';
let sortKey = 'detectado';
let sortDir = 'desc';

const STORAGE_KEY = 'radar-de-vagas:board-status-v1';

async function loadStatus(){
  try{
    const res = await window.storage.get(STORAGE_KEY, false);
    if(res && res.value){
      const saved = JSON.parse(res.value);
      jobs.forEach(j => { if(saved[j.id]) j.status = saved[j.id]; });
    }
  }catch(e){ /* nada salvo ainda, segue com o estado padrão */ }
}

async function saveStatus(){
  try{
    const map = {};
    jobs.forEach(j => map[j.id] = j.status);
    await window.storage.set(STORAGE_KEY, JSON.stringify(map), false);
  }catch(e){ console.error('Falha ao salvar o board', e); }
}

function populateFilterOptions(){
  const cats = [...new Set(jobs.map(j => j.categoria))].sort();
  const plats = [...new Set(jobs.map(j => j.plataforma))].sort();
  const catSel = document.getElementById('f-categoria');
  const platSel = document.getElementById('f-plataforma');
  cats.forEach(c => catSel.insertAdjacentHTML('beforeend', `<option value="${c}">${c}</option>`));
  plats.forEach(p => platSel.insertAdjacentHTML('beforeend', `<option value="${p}">${p}</option>`));
}

function getFiltered(){
  const q = document.getElementById('search').value.trim().toLowerCase();
  const cat = document.getElementById('f-categoria').value;
  const plat = document.getElementById('f-plataforma').value;
  const onlyAlerta = document.getElementById('f-alerta').checked;
  let list = jobs.filter(j => {
    if(onlyAlerta) return false;
    if(cat && j.categoria !== cat) return false;
    if(plat && j.plataforma !== plat) return false;
    if(q){
      const hay = (j.empresa + ' ' + j.vaga + ' ' + j.categoria).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
  const sort = document.getElementById('f-sort').value;
  list.sort((a,b) => {
    if(sort === 'empresa') return a.empresa.localeCompare(b.empresa);
    if(sort === 'antigo') return a.detectado.localeCompare(b.detectado);
    return b.detectado.localeCompare(a.detectado);
  });
  return list;
}

function fmtDate(iso){
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${y}`;
}

function renderStats(){
  const total = jobs.length;
  const naLista = jobs.filter(j => j.naLista).length;
  const empresas = new Set(jobs.map(j => j.empresa)).size;
  const emPipeline = jobs.filter(j => j.status !== 'detectado').length;
  document.getElementById('subtitle').textContent = `${total} vagas monitoradas · ${empresas} empresas`;
  document.getElementById('stats').innerHTML = `
    <div class="stat"><b>${total}</b><span>vagas</span></div>
    <div class="stat"><b>${naLista}</b><span>na lista</span></div>
    <div class="stat"><b>${empresas}</b><span>empresas</span></div>
    <div class="stat"><b>${emPipeline}</b><span>em pipeline</span></div>
  `;
}

function renderTable(){
  const list = getFiltered();
  const body = document.getElementById('table-body');
  const empty = document.getElementById('table-empty');
  if(list.length === 0){
    body.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';
  body.innerHTML = list.map(j => `
    <tr>
      <td><span class="badge-cv">sem CV</span></td>
      <td class="empresa">${j.empresa}</td>
      <td>
        <div class="vaga">${j.vaga}</div>
        <div class="meta"><span class="tag">${j.categoria}</span></div>
      </td>
      <td class="mono">${j.plataforma}</td>
      <td>${j.local}</td>
      <td>${j.naLista ? '<span class="badge-sim">Sim</span>' : '<span class="badge-nao">Não</span>'}</td>
      <td class="mono">${fmtDate(j.detectado)}</td>
      <td>
        ${j.status === 'detectado'
          ? `<button class="add-btn" data-move="${j.id}">+ pipeline</button>`
          : `<span class="mono">em ${j.status}</span>`}
      </td>
    </tr>
  `).join('');

  body.querySelectorAll('[data-move]').forEach(btn => {
    btn.addEventListener('click', () => {
      const job = jobs.find(j => j.id === btn.dataset.move);
      job.status = 'aplicado';
      saveStatus();
      renderAll();
    });
  });
}

function renderBoard(){
  const board = document.getElementById('board');
  board.innerHTML = STAGES.map(stage => {
    const cards = jobs.filter(j => j.status === stage.key);
    return `
      <div class="col" data-stage="${stage.key}">
        <div class="col-head">
          <div class="col-head-title"><span class="prompt">$</span> ${stage.label}</div>
          <span class="col-count">${cards.length}</span>
        </div>
        <div class="col-body" data-drop="${stage.key}">
          ${cards.length === 0
            ? `<div class="col-empty">arraste uma vaga pra cá</div>`
            : cards.map(cardHtml).join('')}
        </div>
      </div>
    `;
  }).join('');

  board.querySelectorAll('.card').forEach(card => {
    card.addEventListener('dragstart', e => {
      e.dataTransfer.setData('text/plain', card.dataset.id);
    });
  });
  board.querySelectorAll('.col-body').forEach(zone => {
    zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('dragover'); });
    zone.addEventListener('dragleave', () => zone.classList.remove('dragover'));
    zone.addEventListener('drop', e => {
      e.preventDefault();
      zone.classList.remove('dragover');
      const id = e.dataTransfer.getData('text/plain');
      const job = jobs.find(j => j.id === id);
      if(job){ job.status = zone.dataset.drop; saveStatus(); renderAll(); }
    });
  });
  board.querySelectorAll('.card select').forEach(sel => {
    sel.addEventListener('change', () => {
      const job = jobs.find(j => j.id === sel.dataset.id);
      job.status = sel.value;
      saveStatus();
      renderAll();
    });
  });
}

function cardHtml(j){
  return `
    <div class="card" draggable="true" data-id="${j.id}">
      <div class="card-empresa">${j.empresa}</div>
      <div class="card-vaga">${j.vaga}</div>
      <div class="card-meta">
        <span class="mono">${j.plataforma} · ${fmtDate(j.detectado)}</span>
        <select data-id="${j.id}">
          ${STAGES.map(s => `<option value="${s.key}" ${s.key === j.status ? 'selected' : ''}>${s.label}</option>`).join('')}
        </select>
      </div>
    </div>
  `;
}

function renderAll(){
  renderStats();
  if(activeTab === 'radar') renderTable();
  else renderBoard();
}

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    activeTab = tab.dataset.tab;
    document.getElementById('view-radar').style.display = activeTab === 'radar' ? 'block' : 'none';
    document.getElementById('view-pipeline').style.display = activeTab === 'pipeline' ? 'block' : 'none';
    renderAll();
  });
});

['search','f-categoria','f-plataforma','f-sort','f-alerta'].forEach(id => {
  document.getElementById(id).addEventListener('input', renderAll);
});
document.getElementById('clear-filters').addEventListener('click', () => {
  document.getElementById('search').value = '';
  document.getElementById('f-categoria').value = '';
  document.getElementById('f-plataforma').value = '';
  document.getElementById('f-sort').value = 'recente';
  document.getElementById('f-alerta').checked = false;
  renderAll();
});

(async function init(){
  populateFilterOptions();
  await loadStatus();
  renderAll();
})();
</script>
</body>
</html>
